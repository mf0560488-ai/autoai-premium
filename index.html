<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faisal Binary Trading Bot</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 18px; color: #00ffcc; margin-top: 10px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            text-align: left;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8b949e;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <h1>FAISAL BINARY TRADING BOT</h1>
    <p>অ্যাডভান্সড মার্কেট মনিটরিং ও অ্যানালাইসিস ড্যাশবোর্ড</p>

    <!-- মার্কেট সিলেকশন বাটন -->
    <div class="card">
        <h3>📊 মার্কেট নির্বাচন করুন</h3>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="showMarket('OTC')">OTC Market</button>
            <button class="btn" onclick="showMarket('Real')">Real Market</button>
        </div>
    </div>

    <!-- টাইমফ্রেম বাটন -->
    <div class="card" id="timeframe-section" style="display:none;">
        <h3>⏱️ সময় নির্বাচন করুন</h3>
        <div style="display: flex; gap: 5px;">
            <button class="btn" onclick="setTimer('1m')">1 Min</button>
            <button class="btn" onclick="setTimer('5m')">5 Min</button>
            <button class="btn" onclick="setTimer('15m')">15 Min</button>
        </div>
    </div>

    <!-- ফুটার যেখানে অনারের নাম ফিক্সড থাকবে -->
    <div class="footer">
        <p>Powered & Managed by Bot Owner: <b>Faisal</b></p>
        <p>© 2026 Faisal Binary Trading Bot. All Rights Reserved.</p>
    </div>

    <script>
        function showMarket(type) {
            document.getElementById('timeframe-section').style.display = 'block';
            alert(type + ' মার্কেট সিলেক্ট হয়েছে। এখন টাইমফ্রেম বেছে নিন।');
        }
        
        function setTimer(time) {
            alert('আপনি ' + time + ' টাইমফ্রেম সিলেক্ট করেছেন। এখন চার্ট দেখে নিজে ট্রেড এক্সিকিউট করুন।');
        }
    </script>
</body>
</html>
