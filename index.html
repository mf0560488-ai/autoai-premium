<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAI Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #fff; padding: 15px; text-align: center; min-height: 100vh; }
        
        .header { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .owner { font-size: 14px; color: #cbd5e1; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); text-align: left; }
        .card h3 { font-size: 16px; color: #38bdf8; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        .signal-box { background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 14px; border-left: 4px solid #22c55e; }
        .signal-box.red { border-left-color: #ef4444; }

        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 8px; font-size: 14px; outline: none; }
        
        .btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; transition: 0.3s; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .btn:active { transform: scale(0.98); }

        .result-text { margin-top: 10px; font-size: 14px; color: #34d399; font-weight: bold; }
        .footer { margin-top: 25px; font-size: 13px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
    </style>
</head>
<body>

    <div class="header">🌟 ＡＵＴＯ ＡＩ ＰＲＥＭＩＵМ 🌟</div>
    <div class="owner">👑 Owner: FAISAL TRADER</div>

    <!-- লাইভ সিগন্যাল সেকশন -->
    <div class="card">
        <h3>⚡ লাইভ ও ফিউচার সিগন্যাল</h3>
        <div class="signal-box">EUR/USD (OTC) - <b>CALL 🟢</b> (Win Rate: 94%)</div>
        <div class="signal-box red" style="margin-top: 8px;">GBP/JPY (Real) - <b>PUT 🔴</b> (Win Rate: 91%)</div>
    </div>

    <!-- মানি ম্যানেজমেন্ট ক্যালকুলেটর -->
    <div class="card">
        <h3>📊 মানি ম্যানেজমেন্ট ক্যালকুলেটর</h3>
        <label style="font-size: 13px; color: #cbd5e1;">আপনার মোট ক্যাপিটাল ($):</label>
        <input type="number" id="capital" placeholder="উদাহরণ: 100">
        <button class="btn" onclick="calculateMoney()">হিসাব করুন (২% রিস্ক)</button>
        <div id="result" class="result-text"></div>
    </div>

    <!-- এআই মার্কেট স্ক্যানার -->
    <div class="card">
        <h3>🤖 এআই মার্কেট স্ক্যান ও অটো ট্রেড</h3>
        <button class="btn" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);" onclick="scanMarket()">মার্কেট স্ক্যান শুরু করুন</button>
        <div id="scanResult" class="result-text" style="color: #60a5fa;"></div>
    </div>

    <div class="footer">
        <p>💎 Powered & Managed by <b>FAISAL TRADER</b></p>
    </div>

    <script>
        function calculateMoney() {
            let cap = document.getElementById('capital').value;
            if(cap && cap > 0) {
                let tradeAmt = (cap * 0.02).toFixed(2);
                let martingale1 = (tradeAmt * 2).toFixed(2);
                document.getElementById('result').innerHTML = `✅ প্রথম ট্রেড: $${tradeAmt} <br>✅ মার্টিনজেল স্টেপ ১: $${martingale1}`;
            } else {
                document.getElementById('result').innerHTML = "⚠️ দয়া করে সঠিক অ্যামাউন্ট লিখুন!";
            }
        }

        function scanMarket() {
            document.getElementById('scanResult').innerHTML = "🔄 এআই স্ক্যানিং চলছে... দয়া করে অপেক্ষা করুন।";
            setTimeout(() => {
                document.getElementById('scanResult').innerHTML = "🚀 স্ক্যান সফল! সেরা পেয়ার: AUD/CAD (OTC) - <b>CALL 🟢</b>";
            }, 1500);
        }
    </script>
</body>
</html>
